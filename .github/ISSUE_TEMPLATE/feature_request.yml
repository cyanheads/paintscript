name: Feature Request
description: A new brush, paint behavior, script function, view, or CLI option
labels: ["enhancement"]
assignees: ["cyanheads"]
body:
  - type: markdown
    attributes:
      value: |
        **Secondary labels.** `enhancement` is applied automatically — also add one or more of the following in the sidebar if they apply:
        - `performance` — improves memory, CPU, or run time
        - `security` — hardens the sandbox or its limits
        - `breaking-change` — changes the public API, the script vocabulary, or the journal format

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: One or two sentences — what you were trying to paint, and what got in the way.
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed behavior
      description: What the engine or the script vocabulary should do. A short script showing how you'd call it helps.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What you tried or considered instead, and why it fell short.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Only what the reader needs to act — related issues, prior art, a link.
    validations:
      required: false
